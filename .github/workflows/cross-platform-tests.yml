name: Cross-platform tests

on:
  push:
  pull_request:

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: plugins/mato-blog-codex/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r plugins/mato-blog-codex/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s plugins/mato-blog-codex/tests -v
